<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 374" width="720" height="374">
  <defs>
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
  </defs>
  <style>
    .terminal-text { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, Monaco, Consolas, monospace; font-size: 13px; fill: #c9d1d9; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; font-weight: 500; }
    .prompt { fill: #58a6ff; font-weight: bold; }
    .cmd-text { fill: #f0f6fc; font-weight: bold; }
  </style>
  <rect x="0" y="0" width="720" height="374" rx="10" fill="url(#bg_grad)" stroke="#30363d" stroke-width="1.5" />
  <circle cx="20" cy="20" r="6" fill="#ff5f56" />
  <circle cx="40" cy="20" r="6" fill="#ffbd2e" />
  <circle cx="60" cy="20" r="6" fill="#27c93f" />
  <text x="360.0" y="24" text-anchor="middle" class="title-text">orderkuota-gateway — cli execution</text>
  <line x1="0" y1="38" x2="720" y2="38" stroke="#30363d" stroke-width="1" />
  <text x="24" y="56" class="terminal-text"><tspan class="prompt">$ </tspan><tspan class="cmd-text">python3 gateway.py --help</tspan></text>
  <text x="24" y="78" class="terminal-text"><tspan>usage: gateway.py [-h] [--create CREATE] [--status STATUS] [--cancel CANCEL]</tspan></text>
  <text x="24" y="98" class="terminal-text"><tspan>                  [--wait WAIT] [--history] [--sync]</tspan></text>
  <text x="24" y="118" class="terminal-text"></text>
  <text x="24" y="138" class="terminal-text"><tspan>OrderKuota Automated QRIS Payment Gateway</tspan></text>
  <text x="24" y="158" class="terminal-text"></text>
  <text x="24" y="178" class="terminal-text"><tspan>options:</tspan></text>
  <text x="24" y="198" class="terminal-text"><tspan>  -h, --help       show this help message and exit</tspan></text>
  <text x="24" y="218" class="terminal-text"><tspan>  --create CREATE  Buat tiket deposit QRIS dengan nominal tertentu</tspan></text>
  <text x="24" y="238" class="terminal-text"><tspan>  --status STATUS  Cek status deposit berdasarkan ID</tspan></text>
  <text x="24" y="258" class="terminal-text"><tspan>  --cancel CANCEL  Batalkan deposit berdasarkan ID</tspan></text>
  <text x="24" y="278" class="terminal-text"><tspan>  --wait WAIT      Tunggu status deposit sampai terbayar (deposit ID)</tspan></text>
  <text x="24" y="298" class="terminal-text"><tspan>  --history        Lihat riwayat transaksi deposit</tspan></text>
  <text x="24" y="318" class="terminal-text"><tspan>  --sync           Sinkronisasi token &amp; cookies dari perangkat Android via ADB</tspan></text>
  <text x="24" y="338" class="terminal-text"></text>
</svg>
